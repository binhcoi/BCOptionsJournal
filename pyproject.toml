[project]
name = "bcoj"
dynamic = ["version"]
description = "BC Options Trade Journal - a local options journal with correct P/L across rolls, assignments, covered calls and shares"
requires-python = ">=3.10"

# The engine and importer are deliberately dependency-free: Decimal, csv and
# sqlite3 are all standard library. That keeps the P/L rules testable anywhere
# and means the reconciliation runs on a machine with no package manager.
dependencies = []


[project.scripts]
bcoj = "bcoj.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bcoj*"]

[tool.setuptools.dynamic]
version = {attr = "bcoj.__version__"}
