[project]
name = "bcoj"
version = "0.1.0"
description = "BC Options Trade Journal - a local options journal with correct P/L across rolls, assignments, covered calls and shares"
requires-python = ">=3.10"

# The engine and importer are deliberately dependency-free: Decimal, csv and
# sqlite3 are all standard library. That keeps the P/L rules testable anywhere
# and means the reconciliation runs on a machine with no package manager.
dependencies = []

[project.optional-dependencies]
# Added at M2, when there is a UI to serve. Runs in Docker.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.scripts]
bcoj = "bcoj.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bcoj*"]
