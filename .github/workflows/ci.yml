# Tests on every push and pull request. A push to main whose bcoj.__version__
# has no tag yet is a release: tag it, build the wheel, publish the release
# with the wheel and the deploy scripts, push the image to GHCR.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -q

  version:
    # Is this commit a version nobody has released yet?
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(python3 -c "import bcoj; print(bcoj.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=no" >> "$GITHUB_OUTPUT"; echo "v$version already released"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"; echo "v$version is new"
          fi

  release:
    needs: version
    if: needs.version.outputs.release == 'yes'
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - name: tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "$TAG" && git push origin "$TAG"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.whl deploy/*.sh deploy/bcoj.service --generate-notes
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bcoj:${{ needs.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/bcoj:latest
